name: Sync upstream and release

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'charmbracelet/crush'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/charmbracelet/crush.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$(git tag --list '*-yy.*')" ]]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Pause before committing so fork workflows can be restored even
          # when upstream changes cause conflicts in that directory.
          if ! git merge --no-commit --no-ff upstream/main; then
            if ! git rev-parse --quiet --verify MERGE_HEAD > /dev/null; then
              echo "::error::Could not start the upstream merge."
              exit 1
            fi
          fi
          # HEAD is still the fork commit, including intentionally deleted
          # workflows. Restoring it also resolves workflow-only conflicts.
          while IFS= read -r -d '' workflow; do
            if ! git cat-file -e "HEAD:$workflow" 2>/dev/null; then
              git rm -- "$workflow"
            fi
          done < <(git diff --name-only --diff-filter=U -z -- .github/workflows)
          git restore --source=HEAD --staged --worktree -- .github/workflows
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicts" ]]; then
            echo "::error::Upstream merge has conflicts outside .github/workflows."
            printf '%s\n' "$conflicts"
            {
              echo "## Upstream merge needs manual resolution"
              echo
              echo '```text'
              printf '%s\n' "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -m "chore: merge upstream main"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.merge.outputs.should_release == 'true'
        with:
          go-version-file: go.mod

      - name: Test merged code
        id: tests
        if: steps.merge.outputs.should_release == 'true'
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          go test -json -failfast -timeout=10m ./... | python3 .github/scripts/report-go-tests.py "$RUNNER_TEMP/go-test.jsonl"

      - name: Save failed test log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-test-log
          path: ${{ runner.temp }}/go-test.jsonl
          retention-days: 7

      - name: Push merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Push release tag
        if: steps.merge.outputs.should_release == 'true'
        id: tag
        shell: bash
        run: |
          upstream_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ -z "$upstream_tag" ]]; then
            upstream_tag="v0.0.0"
          fi
          release_tag="${upstream_tag}+fork.${GITHUB_RUN_NUMBER}"
          git tag "$release_tag"
          git push origin "$release_tag"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.merge.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run github.com/goreleaser/goreleaser/v2@v2.12.7 release --clean --config .goreleaser-fork.yml
